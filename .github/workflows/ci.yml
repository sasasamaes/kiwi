name: Kiwi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: este workflow ejecuta código de PRs (checkout del merge
# commit + npm ci con lifecycle scripts). Sin este bloque el GITHUB_TOKEN
# ambiente hereda el default del repo/org, que puede ser write.
permissions:
  contents: read

jobs:
  hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check for dead infrastructure hosts
        run: npm run check:dead-hosts

      - name: Check Prisma schema invariant (exactly one schema)
        run: npm run check:prisma-schema

  client-bundle-safety:
    name: Client Bundle Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup dependencies (cached)
        uses: ./.github/actions/setup-deps

      - name: Build client apps
        run: npx turbo run build --filter='./apps/*'

      - name: Check client bundles (source + built chunks)
        run: npm run check:client-bundle

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup dependencies (cached)
        uses: ./.github/actions/setup-deps

      - name: Generate Prisma client
        run: cd api && npx prisma generate

      - name: Type-check workspace (turbo)
        run: npx turbo run type-check

      - name: Run API tests
        run: cd api && npm test

      - name: Build API with NestJS
        run: cd api && npx nest build

      - name: Verify API builds
        run: test -f api/dist/main.js && echo "✅ API build OK" || echo "❌ API build failed"

  migrations:
    name: Migrations up-to-date (schema ↔ DB)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiwi
          POSTGRES_PASSWORD: kiwi
          POSTGRES_DB: kiwi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiwi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kiwi:kiwi@localhost:5432/kiwi_ci

    steps:
      - uses: actions/checkout@v5

      - name: Setup dependencies (cached)
        uses: ./.github/actions/setup-deps

      - name: Apply all migrations to a fresh database
        run: cd api && npx prisma migrate deploy

      - name: Assert migrations reproduce schema.prisma exactly (no drift)
        working-directory: api
        run: |
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code > /tmp/drift.sql 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "✅ No drift: applied migrations reproduce schema.prisma exactly."
            exit 0
          fi
          echo "❌ Drift between applied migrations and schema.prisma (prisma migrate diff exit $code)."
          echo "SQL that would make the migrated database match schema.prisma:"
          cat /tmp/drift.sql
          echo
          echo "Fix locally with: cd api && npx prisma migrate dev --name <change>"
          exit 1

  e2e:
    name: E2E Flow (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiwi
          POSTGRES_PASSWORD: kiwi
          POSTGRES_DB: kiwi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiwi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kiwi:kiwi@localhost:5432/kiwi_ci
      JWT_SECRET: ci-e2e-secret-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - name: Setup dependencies (cached)
        uses: ./.github/actions/setup-deps

      - name: Generate Prisma client
        run: cd api && npx prisma generate

      - name: Apply database schema
        run: cd api && npx prisma migrate deploy

      - name: Seed demo data
        run: cd api && npx prisma db seed

      - name: Build API with NestJS
        run: cd api && npx nest build

      - name: Start API and wait for readiness
        run: |
          cd api
          PORT=3000 npm run start:prod > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/payments/methods > /dev/null; then
              echo "🥝 API ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "❌ API did not become ready in 60s"
          tail -60 /tmp/api.log
          exit 1

      - name: Run E2E flow
        run: node scripts/e2e-prod-flow.mjs http://localhost:3000

      - name: API logs on failure
        if: failure()
        run: tail -100 /tmp/api.log
