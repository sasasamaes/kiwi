name: Kiwi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        run: cd api && npm install --legacy-peer-deps
        env:
          npm_config_ignore_scripts: false
          npm_config_allow_scripts: true

      - name: Generate Prisma client
        run: cd api && npx prisma generate

      - name: Run API tests
        run: cd api && npm test

      - name: Build API with SWC
        run: cd api && npx swc src -d dist

      - name: Verify API builds
        run: test -f api/dist/main.js && echo "✅ API build OK" || echo "❌ API build failed"
