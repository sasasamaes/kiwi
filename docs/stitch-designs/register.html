<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Registro Kiwi</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-tint": "#4ae176",
                        "surface-container": "#171f33",
                        "amber-sunburst": "#f59e0b",
                        "secondary-fixed-dim": "#4de082",
                        "background": "#0b1326",
                        "surface-dim": "#0b1326",
                        "on-tertiary-fixed": "#002113",
                        "on-tertiary-container": "#004a31",
                        "on-background": "#dbe2fd",
                        "on-secondary-fixed": "#00210c",
                        "on-secondary-container": "#003e1c",
                        "secondary-container": "#00b55d",
                        "surface-container-highest": "#2d3449",
                        "on-primary": "#003915",
                        "secondary-fixed": "#6dfe9c",
                        "surface-variant": "#2d3449",
                        "outline-variant": "#3d4a3d",
                        "inverse-on-surface": "#283044",
                        "tertiary-fixed": "#6ffbbe",
                        "on-surface-variant": "#bccbb9",
                        "on-primary-fixed-variant": "#005321",
                        "error-crimson": "#ffb4ab",
                        "primary-fixed": "#6bff8f",
                        "surface-container-lowest": "#060d20",
                        "on-secondary": "#003919",
                        "on-primary-fixed": "#002109",
                        "error-container": "#93000a",
                        "on-primary-container": "#004b1e",
                        "on-tertiary": "#003824",
                        "on-error-container": "#ffdad6",
                        "surface-container-low": "#131b2e",
                        "tertiary-container": "#28c38a",
                        "surface-glass": "rgba(30, 41, 59, 0.75)",
                        "outline": "#869585",
                        "on-secondary-fixed-variant": "#005227",
                        "sinpe-blue": "#0284c7",
                        "error": "#ffb4ab",
                        "tertiary": "#50dfa4",
                        "surface-bright": "#31394e",
                        "primary-container": "#22c55e",
                        "inverse-primary": "#006e2f",
                        "border-deep": "rgba(51, 65, 85, 0.6)",
                        "canvas": "#0b1326",
                        "primary": "#4be277",
                        "surface-container-high": "#222a3e",
                        "secondary": "#4de082",
                        "primary-fixed-dim": "#4ae176",
                        "text-primary": "#f8fafc",
                        "surface": "#0b1326",
                        "on-tertiary-fixed-variant": "#005236",
                        "inverse-surface": "#dbe2fd",
                        "on-error": "#690005",
                        "on-surface": "#dbe2fd",
                        "text-muted": "#94a3b8",
                        "tertiary-fixed-dim": "#4edea3"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        "gap-dense": "0.5rem",
                        "touch-target-min": "44px",
                        "gutter-mobile": "0.75rem",
                        "container-max-desktop": "1200px",
                        "margin-mobile": "1rem"
                    },
                    fontFamily: {
                        "headline-lg": ["Geist", "sans-serif"],
                        "numbers-md": ["JetBrains Mono", "monospace"],
                        "numbers-lg": ["JetBrains Mono", "monospace"],
                        "headline-sm": ["Geist", "sans-serif"],
                        "label-md": ["Geist", "sans-serif"],
                        "headline-md": ["Geist", "sans-serif"],
                        "label-sm": ["Geist", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background-color: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .ambient-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(34,197,94,0.15) 0%, rgba(11,19,38,0) 70%);
            z-index: -1;
            pointer-events: none;
        }
        .form-input-glass {
            background-color: #171f33; /* surface-container */
            border: 1px solid rgba(51, 65, 85, 0.6); /* border-deep */
            color: #f8fafc;
        }
        .form-input-glass:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 1px #22c55e, 0 0 15px rgba(34,197,94,0.15);
            outline: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-[884px] w-full max-w-[390px] mx-auto overflow-x-hidden relative flex flex-col antialiased">
<div class="ambient-glow"></div>
<!-- TopAppBar -->
<header class="flex items-center h-14 px-gutter-mobile w-full fixed top-0 w-full backdrop-blur-xl border-b border-border-deep bg-surface-glass dark:bg-surface-glass z-50">
<button aria-label="Volver" class="w-10 h-10 flex items-center justify-center text-primary dark:text-primary active:scale-95 duration-200 mr-2">
<span class="material-symbols-outlined" data-icon="arrow_back" data-weight="fill" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-[20px] leading-[1.2] tracking-[-0.02em] font-semibold text-primary dark:text-primary">Crear cuenta</h1>
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile pt-20 pb-24 flex flex-col gap-6">
<!-- Role Selection -->
<section class="flex gap-gap-dense w-full">
<!-- Active Card (Comerciante) -->
<button class="glass-panel flex-1 rounded-xl p-4 flex flex-col items-start gap-2 border border-primary-container shadow-[0_0_15px_rgba(34,197,94,0.15)] relative overflow-hidden active:scale-95 transition-transform">
<div class="absolute inset-0 bg-primary-container/10"></div>
<div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center text-primary relative z-10">
<span class="material-symbols-outlined text-lg" data-icon="storefront">storefront</span>
</div>
<div class="text-left relative z-10 mt-1">
<h3 class="font-label-md text-[13px] leading-[1] tracking-[0.04em] font-semibold text-text-primary mb-1">Comerciante</h3>
<p class="font-body-md text-[12px] leading-[1.4] text-text-muted">Vende y ofrece delivery</p>
</div>
</button>
<!-- Inactive Card (Repartidor) -->
<button class="glass-panel flex-1 rounded-xl p-4 flex flex-col items-start gap-2 border border-transparent hover:border-border-deep active:scale-95 transition-all opacity-70">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-lg" data-icon="two_wheeler">two_wheeler</span>
</div>
<div class="text-left mt-1">
<h3 class="font-label-md text-[13px] leading-[1] tracking-[0.04em] font-semibold text-text-primary mb-1">Repartidor</h3>
<p class="font-body-md text-[12px] leading-[1.4] text-text-muted">Gana dinero con tu moto</p>
</div>
</button>
</section>
<!-- Form -->
<form class="flex flex-col gap-5 mt-2" onsubmit="event.preventDefault();">
<!-- Nombre -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-[13px] leading-[1] tracking-[0.04em] font-semibold text-text-muted ml-1" for="nombre">Nombre completo</label>
<input class="form-input-glass w-full rounded-lg h-[52px] px-4 font-body-md text-[16px] transition-colors" id="nombre" placeholder="Ej. Juan Pérez" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-[13px] leading-[1] tracking-[0.04em] font-semibold text-text-muted ml-1" for="email">Correo electrónico</label>
<input class="form-input-glass w-full rounded-lg h-[52px] px-4 font-body-md text-[16px] transition-colors" id="email" placeholder="tu@correo.com" type="email"/>
</div>
<!-- Teléfono (con prefijo) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-[13px] leading-[1] tracking-[0.04em] font-semibold text-text-muted ml-1" for="telefono">Teléfono</label>
<div class="flex">
<div class="flex items-center justify-center gap-1.5 form-input-glass rounded-l-lg border-r-0 h-[52px] px-3 bg-surface-variant/30">
<span aria-label="Bandera Costa Rica" class="text-lg leading-none" role="img">🇨🇷</span>
<span class="font-numbers-md text-[16px] font-bold text-text-muted">+506</span>
</div>
<input class="form-input-glass flex-1 rounded-r-lg h-[52px] px-4 font-numbers-md text-[16px] font-bold tracking-wider transition-colors" id="telefono" placeholder="8888 8888" type="tel"/>
</div>
</div>
<!-- Contraseña -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-[13px] leading-[1] tracking-[0.04em] font-semibold text-text-muted ml-1" for="password">Contraseña</label>
<div class="relative">
<input class="form-input-glass w-full rounded-lg h-[52px] px-4 pr-12 font-body-md text-[16px] transition-colors" id="password" placeholder="••••••••" type="password" value="secre"/>
<button class="absolute right-0 top-0 h-[52px] w-12 flex items-center justify-center text-text-muted hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Password Strength -->
<div class="flex gap-1 mt-1 px-1 h-1.5">
<div class="flex-1 bg-error rounded-full shadow-[0_0_8px_rgba(255,180,171,0.4)]"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
</div>
<span class="font-label-sm text-[11px] text-error-crimson ml-1 mt-1">Débil</span>
</div>
<!-- CTA -->
<button class="w-full bg-primary-container text-on-primary-container h-[52px] rounded-full font-label-md text-[13px] tracking-[0.04em] font-bold uppercase mt-6 hover:bg-primary-fixed active:-translate-y-px active:shadow-inner transition-all shadow-[0_4px_14px_rgba(34,197,94,0.3)]" type="submit">
                Crear cuenta
            </button>
<!-- Login Link -->
<div class="text-center mt-4">
<a class="font-body-md text-[14px] text-text-muted hover:text-primary transition-colors" href="#">
                    ¿Ya tienes cuenta? <span class="text-primary font-semibold">Iniciar sesión</span>
</a>
</div>
</form>
</main>
</body></html>
