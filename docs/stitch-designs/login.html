</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="password">Contraseña</label>

<span class="material-symbols-outlined">visibility</span>
</button>
</div>

<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-text-primary transition-colors">Recordarme</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#">¿Olvidaste contraseña?</a>
